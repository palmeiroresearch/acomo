name: Tasas

# Actualiza public/data/rates.json desde cubadivisas y el API del BCC.
#
# Correcciones respecto al workflow original, que llevaba meses fallando sin que
# nadie se enterara:
#   - `concurrency` para que dos corridas no se pisen al hacer push.
#   - `git pull --rebase` antes del push (antes fallaba si entraba otro commit).
#   - Abre un issue cuando la cadena falla y lo cierra al recuperarse. Antes el
#     único rastro era un check rojo que nadie miraba.
#   - Sin `[skip ci]` en el commit: el deploy TIENE que correr para que la tasa
#     nueva llegue a Pages.
#
# Aviso de GitHub: los cron se desactivan solos tras 60 días sin actividad en el
# repo. Los commits del bot cuentan como actividad, pero si el repo queda
# inactivo de verdad hay que reactivarlo a mano en la pestaña Actions.

on:
  schedule:
    # Cada 30 minutos, que es el ritmo al que se refresca la fuente. Correrlo
    # también de madrugada sale casi gratis: si la tasa no cambió no hay commit,
    # y sin commit no hay deploy.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Obtener tasas
        id: fetch
        continue-on-error: true
        # `shell: bash` no es decorativo: añade `-o pipefail`, que el shell por
        # defecto de Actions (`bash -e`) NO trae. Sin él, el código de salida de
        # la tubería sería el de `tee` —siempre 0— y un fallo del pipeline se
        # daría por bueno, que es exactamente el fallo silencioso que este
        # rebuild existe para eliminar.
        shell: bash
        run: python -m scripts.rates.main | tee rates-run.log

      - name: Resumen
        if: always()
        shell: bash
        run: |
          {
            echo "### Tasas"
            echo
            echo '```'
            cat rates-run.log 2>/dev/null || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cambios
        if: steps.fetch.outcome == 'success'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/rates.json public/data/history.json

          if git diff --staged --quiet; then
            echo "Sin cambios en las tasas."
            exit 0
          fi

          git commit -m "tasas: actualizar desde ${{ steps.fetch.outputs.informal_source || 'cubadivisas' }}"

          # Reintento con rebase: con una corrida cada 30 min, otra puede haber
          # adelantado la rama entre el checkout y este punto.
          #
          # El `if` no es cosmético. Este paso corre con `set -e` (lo trae
          # `shell: bash`), y en una lista `A && B` el -e aborta el script en
          # cuanto A falla — así que escrito como `git pull && git push && exit 0`
          # el bucle salía al primer intento y los reintentos nunca ocurrían.
          # Dentro de un `if`, bash suspende el -e y el bucle funciona de verdad.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "Publicado."
              exit 0
            fi
            echo "Push falló (intento $attempt de 3)."
            sleep 5
          done

          echo "::error::No se pudo publicar tras 3 intentos. La causa más común \
          es que el token sea de solo lectura: Settings → Actions → General → \
          Workflow permissions → «Read and write permissions»."
          exit 1

      - name: Avisar por issue si la cadena falló
        if: steps.fetch.outcome != 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const title = 'Pipeline de tasas: la fuente no responde';
            const log = fs.existsSync('rates-run.log')
              ? fs.readFileSync('rates-run.log', 'utf8').slice(-3000)
              : '(sin log)';
            const body = [
              'El pipeline no obtuvo datos válidos y no había valor previo que',
              'arrastrar, así que **no se publicó nada**.',
              '',
              'Lo más probable: cubadivisas cambió el formato de su página. Los',
              'tests de `scripts/rates/tests` lo confirmarán.',
              '',
              `Corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              log,
              '```',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'tasas',
            });
            const existing = open.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['tasas'],
              });
            }

      - name: Cerrar el issue al recuperarse
        if: steps.fetch.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Pipeline de tasas: la fuente no responde';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'tasas',
            });
            for (const issue of open.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'Recuperado: la fuente volvió a responder.',
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }

      - name: Marcar la corrida si se arrastró dato viejo
        if: steps.fetch.outputs.carried != ''
        run: |
          echo "::warning::Se arrastró el dato anterior de: ${{ steps.fetch.outputs.carried }}. \
          La app lo mostrará con su antigüedad real, pero conviene revisar la fuente."

      - name: Fallar si no se publicó nada
        if: steps.fetch.outcome != 'success'
        run: exit 1
