name: Salud de las fuentes

# Chequeo semanal de las fuentes contra la red real.
#
# No duplica al workflow de tasas: aquel publica, este diagnostica. Sirve para
# detectar una degradación *antes* de que rompa — por ejemplo, que cubadivisas
# empiece a devolver menos monedas, o que el BCC publique una tasa incoherente.
# Con una sola fuente informal, enterarse pronto es lo único que hay.

on:
  schedule:
    - cron: '0 11 * * 1'  # lunes, 07:00 hora de Cuba
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Comprobar fuentes y parsers
        id: probe
        shell: bash
        run: |
          # --dry-run: este workflow diagnostica, no publica.
          if python -m scripts.rates.main --dry-run --no-history > probe.log 2>&1; then
            echo "degraded=0" >> "$GITHUB_OUTPUT"
          else
            echo "degraded=1" >> "$GITHUB_OUTPUT"
          fi

          # Los tests contra HTML congelado delatan un cambio de formato aunque
          # la fuente siga respondiendo.
          if python -m pytest scripts/rates/tests -q >> probe.log 2>&1; then
            echo "parsers=ok" >> "$GITHUB_OUTPUT"
          else
            echo "parsers=fail" >> "$GITHUB_OUTPUT"
            echo "degraded=1" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Salud de las fuentes"
            echo
            echo '```'
            head -c 4000 probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Avisar si algo está degradado
        if: steps.probe.outputs.degraded == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('probe.log', 'utf8').slice(-3000);
            const title = 'Salud de las fuentes: algo no responde como debería';
            const body = [
              'El chequeo semanal encontró un problema. La app sigue sirviendo el',
              'último valor bueno con su antigüedad visible, pero conviene mirarlo.',
              '',
              '```',
              log,
              '```',
              '',
              'Cómo leerlo:',
              '- `parse_failed` o tests en rojo → cubadivisas cambió de formato.',
              '  Regenerar fixtures con `python -m scripts.rates.tests.refresh_fixtures`',
              '  y ajustar el parser. **No relajar el test.**',
              '- Menos monedas de lo habitual → la fuente dejó de publicar alguna.',
              '',
              `Corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'tasas',
            });
            const existing = open.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['tasas'],
              });
            }
