name: Salud de las fuentes

# Chequeo semanal de TODAS las fuentes contra la red real, incluido el intento
# con Chromium contra Cloudflare.
#
# Existe porque la corrida de tasas cada 2 h se detiene en la primera fuente que
# funciona: si cubadivisas responde, nunca sabríamos que directoriocubano llevaba
# un mes roto hasta que cubadivisas también cayera. Esto las prueba todas.
#
# Aquí sí se paga el coste de instalar Chromium (~500 MB), una vez por semana, y
# es el único sitio donde se comprueba si el workaround de elToque funciona.

on:
  schedule:
    - cron: '0 11 * * 1'  # lunes, 07:00 hora de Cuba
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r scripts/requirements.txt
          pip install -r scripts/requirements-browser.txt
          playwright install --with-deps chromium

      - name: Probar cada fuente por separado
        id: probe
        env:
          ELTOQUE_API_KEY: ${{ secrets.ELTOQUE_API_KEY }}
        run: |
          : > report.md
          echo "| Fuente | Estado |" >> report.md
          echo "|---|---|" >> report.md

          failed=0
          for provider in eltoque_api eltoque_browser cubadivisas directoriocubano; do
            # --dry-run: este workflow diagnostica, no publica.
            if out=$(python -m scripts.rates.main --provider "$provider" --dry-run --no-history 2>&1); then
              line=$(echo "$out" | grep -E "^\s+$provider" | head -1 | xargs)
              case "$line" in
                *" OK "*) echo "| \`$provider\` | ✅ $line |" >> report.md ;;
                *)        echo "| \`$provider\` | ⚠️ $line |" >> report.md; failed=1 ;;
              esac
            else
              echo "| \`$provider\` | ❌ error al ejecutar |" >> report.md
              failed=1
            fi
          done

          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "degraded=$failed" >> "$GITHUB_OUTPUT"

      - name: Avisar si alguna fuente está degradada
        if: steps.probe.outputs.degraded == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const report = require('fs').readFileSync('report.md', 'utf8');
            const title = 'Salud de las fuentes: alguna no responde';
            const body = [
              'El chequeo semanal encontró fuentes degradadas. La app sigue',
              'funcionando mientras quede una sana, pero conviene revisar antes de',
              'que caigan las demás.',
              '',
              report,
              '',
              'Notas de lectura:',
              '- `eltoque_api: no_key` es lo esperado hasta que elToque entregue la key.',
              '- `eltoque_browser: cloudflare` significa que el workaround sigue sin pasar.',
              '- `parse_failed` en cubadivisas o directoriocubano sí es acción inmediata:',
              '  cambió el formato y hay que actualizar el parser y las fixtures.',
              '',
              `Corrida: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'tasas',
            });
            const existing = open.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['tasas'],
              });
            }
